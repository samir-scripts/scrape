# ==============================================================================
# SCRAPE SAMPLE WORKFLOW: Bitwarden Remote Engineering
# Target: Bitwarden Greenhouse Openings
# Spec Version: 6 (Multi-source, structured matching, fair budget)
# ==============================================================================

version: 6

metadata:
  name: "Bitwarden — Remote Full-Stack & Security Engineering"
  company: "Bitwarden"
  enabled: true

sources:
  - id: "bitwarden"
    label: "Bitwarden — Greenhouse"
    enabled: true
    employer_hint: "Bitwarden"
    extractor:
      kind: greenhouse
      url: "https://boards.greenhouse.io/bitwarden"

schedule:
  cadence: daily
  time: "09:00"
  cron: "0 0 9 * * *"

filters:
  matching:
    role_types:
      - full_time
    workplaces:
      - remote
    countries:
      - US
      - CA
      - GB
      - IN
    keywords:
      any:
        - Engineer
        - Developer
        - Security
        - QA
        - Cloud
      all: []
      exclude: []
      fields:
        - title

retention:
  days: 30
  policy: untracked_only
