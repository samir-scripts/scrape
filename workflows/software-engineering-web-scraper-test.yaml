# Multi-source web scraping and ATS ingestion test workflow.
# Combines public HTML career page scraping, JSON-LD extraction, public search feeds, and targeted ATS boards.
version: 9
max_jobs_per_run: 25
metadata:
  name: Software Engineering — Web Scraper & Multi-Source Test
  enabled: true
sources:
  - id: public-html-careers
    label: Public HTML Career Page — Heuristic Web Scraper
    enabled: true
    employer_hint: Custom Tech Corp
    extractor:
      kind: selector
      mode: static
      url: https://customtech.example.test/careers
      source_config:
        crawl:
          max_pages: 10
          max_depth: 2
          extraction: public_html
        per_host_delay_ms: 750
        jitter_ms: 500
        ignore_robots: true
  - id: jsonld-careers
    label: Direct JSON-LD Career Board
    enabled: true
    employer_hint: Enterprise Cloud
    extractor:
      kind: jsonld
      url: https://enterprisecloud.example.test/careers
      source_config: {}
  - id: themuse
    label: The Muse — bounded cross-company listings
    enabled: true
    extractor:
      kind: search
      url: themuse
      source_config: {}
  - id: arbeitnow
    label: Arbeitnow — Germany-focused listings
    enabled: true
    extractor:
      kind: search
      url: arbeitnow
      source_config: {}
  - id: jobicy
    label: Jobicy — remote listings
    enabled: true
    extractor:
      kind: search
      url: jobicy
      source_config: {}
  - id: cloudflare
    label: Cloudflare — Greenhouse
    enabled: true
    employer_hint: Cloudflare
    extractor:
      kind: greenhouse
      url: https://boards.greenhouse.io/cloudflare
  - id: linear
    label: Linear — Ashby
    enabled: true
    employer_hint: Linear
    extractor:
      kind: ashby
      url: https://jobs.ashbyhq.com/linear
  - id: sep
    label: SEP — Lever
    enabled: true
    employer_hint: SEP
    extractor:
      kind: lever
      url: https://jobs.lever.co/sep
  - id: nvidia
    label: NVIDIA — Workday
    enabled: true
    employer_hint: NVIDIA
    extractor:
      kind: workday
      url: https://nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite
schedule:
  cadence: manual
  time: 09:00
  timezone: America/New_York
  run_on_startup: false
filters:
  role_types: []
  include_keywords: []
  exclude_keywords: []
  locations: []
  matching:
    target_roles:
      - Software Engineer
      - Software Developer
      - Backend Engineer
      - Frontend Engineer
      - Full Stack
      - Platform Engineer
      - Infrastructure Engineer
      - DevOps Engineer
      - Site Reliability Engineer
      - Data Engineer
      - ML Engineer
      - QA Engineer
      - Firmware Engineer
    companies: []
    keywords: null
    posting_date:
      preset: past_month
      last_hours: null
      from: null
      through: null
      timezone: America/New_York
      include_unknown: true
    compensation: null
    role_types: []
    workplaces: []
    experience_min: null
    experience_max: null
    experience_include_unknown: true
    experience_match_mode: required_minimum
    new_grad: null
    sponsorship: []
    work_auth: []
    clearance: []
    countries: []
    regions: []
    cities: []
    location_include_unknown: true
retention:
  days: 30
  policy: untracked_only
