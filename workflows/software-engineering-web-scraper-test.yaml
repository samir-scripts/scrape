# Development/test-only workflow for exercising bounded public-HTML crawling and automatic page scraping.
# This intentionally ignores robots.txt; do not copy that setting into ordinary user workflows.
version: 10
max_jobs_per_run: 40
metadata:
  name: Software Engineering & Related — US · Past 24 Hours · Crawler Test
  enabled: true
sources:
  - id: palantir-public-html
    label: Palantir — Website crawl and automatic scraping
    enabled: true
    employer_hint: Palantir Technologies
    extractor:
      kind: selector
      mode: static
      url: https://jobs.lever.co/palantir
      source_config:
        crawl:
          max_pages: 50
          max_depth: 2
          extraction: public_html
        per_host_delay_ms: 1000
        jitter_ms: 500
        ignore_robots: true
  - id: sep-public-html
    label: SEP — Website crawl and automatic scraping
    enabled: true
    employer_hint: SEP
    extractor:
      kind: selector
      mode: static
      url: https://jobs.lever.co/sep
      source_config:
        crawl:
          max_pages: 50
          max_depth: 2
          extraction: public_html
        per_host_delay_ms: 1000
        jitter_ms: 500
        ignore_robots: true
schedule:
  cadence: manual
  time: 09:00
  timezone: America/New_York
  run_on_startup: false
filters:
  role_types: []
  include_keywords: []
  exclude_keywords: []
  locations: []
  matching:
    target_roles:
      - Software Engineer
      - Software Developer
      - Software Development Engineer
      - Backend Engineer
      - Backend Developer
      - Back-end Engineer
      - Back-end Developer
      - Frontend Engineer
      - Frontend Developer
      - Front-end Engineer
      - Front-end Developer
      - Full Stack
      - Full-Stack
      - Platform Engineer
      - Infrastructure Engineer
      - DevOps Engineer
      - Site Reliability Engineer
      - Data Engineer
      - Machine Learning Engineer
      - ML Engineer
      - AI Engineer
      - QA Engineer
      - Quality Assurance Engineer
      - Test Automation Engineer
      - Embedded Software
      - Firmware Engineer
      - Mobile Engineer
      - iOS Engineer
      - Android Engineer
      - Web Developer
    companies:
      - Palantir
      - SEP
    keywords: null
    posting_date:
      preset: past_24h
      last_hours: null
      from: null
      through: null
      timezone: America/New_York
      include_unknown: false
    compensation: null
    role_types: []
    workplaces: []
    experience_min: null
    experience_max: null
    experience_include_unknown: true
    experience_match_mode: required_minimum
    new_grad: null
    sponsorship: []
    work_auth: []
    clearance: []
    countries:
      - US
    regions: []
    cities: []
    location_include_unknown: false
retention:
  days: 30
  policy: untracked_only
