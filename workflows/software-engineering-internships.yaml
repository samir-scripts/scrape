# ==============================================================================
# SCRAPE SAMPLE WORKFLOW: Software Engineering Internships
# Target: Cloudflare Global University & Intern Engineering Openings
# Spec Version: 2 (Static YAML Autonomous Workflow Specification)
# ==============================================================================

version: 2

metadata:
  name: "Cloudflare — Software Engineering Internships"
  company: "Cloudflare"
  enabled: true

extractor:
  kind: greenhouse
  url: "https://boards.greenhouse.io/cloudflare"

schedule:
  cadence: daily
  time: "09:00"
  cron: "0 0 9 * * *"

filters:
  role_types:
    - internship
  query: "title LIKE '%Engineer%' OR title LIKE '%Developer%' OR title LIKE '%Intern%'"
  include_keywords:
    - "Software"
    - "Engineer"
    - "Intern"
  exclude_keywords:
    - "MBA"
    - "Sales"
    - "Marketing"
  locations:
    - "Remote"
    - "San Francisco, CA"
    - "Austin, TX"
    - "London"
    - "Lisbon"

retention:
  days: 45
  policy: untracked_only
