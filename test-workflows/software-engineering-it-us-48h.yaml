# Test workflow: US Software Engineering, IT, and related jobs from the past 48 hours.
# Independently follows a public company directory and a labeled archived seed sample.
# Shared quota of 20 jobs across all workflow sources.
version: 11
max_jobs_per_run: 20
metadata:
  name: Software Engineering & IT — US · Past 48 Hours · Test Workflow
  enabled: false
sources:
  - id: public-company-directory
    label: Public company-directory discovery
    enabled: true
    extractor:
      kind: web_discovery
      url: https://en.wikipedia.org/wiki/Category:Software_companies_of_the_United_States
      source_config:
        max_domains: 25
        max_depth: 4
        max_pages: 100
  - id: public-employer-sample
    label: Common Crawl employer-page seed sample
    enabled: true
    extractor:
      kind: web_discovery
      url: https://www.elitehockeyhq.com/careers/senior-software-engineer
      source_config:
        seed_urls:
          - https://eliteperformancetech.com/jobs/software-engineer-back-end-rust/
          - https://www.sanoh-america.com/careers
          - https://www.myturningpt.com/careers/
          - https://www.myubiquity.com/careers
        seed_manifest:
          crawl_id: CC-MAIN-2026-43
          imported_at: "2026-10-31T07:22:02Z"
        max_domains: 25
        max_depth: 4
        max_pages: 100
schedule:
  cadence: manual
  time: "09:00"
  timezone: America/New_York
  run_on_startup: false
filters:
  role_types: []
  include_keywords: []
  exclude_keywords: []
  locations: []
  matching:
    target_roles:
      - Software Engineer
      - Software Developer
      - Software Development Engineer
      - Backend Engineer
      - Backend Developer
      - Back-end Engineer
      - Back-end Developer
      - Frontend Engineer
      - Frontend Developer
      - Front-end Engineer
      - Front-end Developer
      - Full Stack
      - Full-Stack
      - Platform Engineer
      - Infrastructure Engineer
      - DevOps Engineer
      - DevOps
      - Site Reliability Engineer
      - SRE
      - Data Engineer
      - Machine Learning Engineer
      - ML Engineer
      - AI Engineer
      - QA Engineer
      - Quality Assurance Engineer
      - Test Automation Engineer
      - Embedded Software
      - Firmware Engineer
      - Mobile Engineer
      - iOS Engineer
      - Android Engineer
      - Web Developer
      - Systems Administrator
      - System Administrator
      - Network Engineer
      - IT Support
      - IT Specialist
      - IT Administrator
      - IT Manager
      - Information Technology
      - Cloud Engineer
      - Security Engineer
      - Database Administrator
    companies: []
    posting_date:
      preset: past_48h
      timezone: America/New_York
      include_unknown: false
    countries:
      - US
    location_include_unknown: false
retention:
  days: 30
  policy: untracked_only
