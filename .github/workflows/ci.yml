name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install npm dependencies
        run: npm ci

      - name: Build required sidecar
        run: npm run build:sidecar

      - name: Recorded provider HTTP replay through the actual worker
        run: npm run test:providers

      - name: Format check (Rust)
        run: cargo fmt --all --check

      - name: Clippy check (Rust)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (Rust)
        run: cargo test --workspace

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Frontend tests
        run: npm test

      - name: Frontend production build
        run: npm run build

      - name: Production style guard
        run: node scripts/check-style.mjs

      - name: Check bindings drift
        run: |
          cargo test --workspace export_bindings
          git diff --exit-code src/bindings || (echo "TypeScript bindings are out of sync with Rust models. Run 'npm run gen:types' and commit the changes." && exit 1)

      - name: Install browser engine
        run: npx playwright install --with-deps chromium

      - name: Browser interaction regressions
        run: npx playwright test e2e/workflows.pw.ts e2e/jobs.pw.ts e2e/fonts.pw.ts e2e/controls.pw.ts e2e/job-layout.pw.ts

  native-and-visual:
    name: Native and visual verification
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - run: npm ci
      - run: npm run build:sidecar
      - run: cargo build -p scrape
      - run: npx playwright install chromium
      - name: Both-theme screenshot, contrast and keyboard checks
        run: npm run test:browser
      - name: Isolated native IPC, sidecar and opener verification
        run: npm run test:native

      - name: Actual Tauri development startup and historical upgrades
        run: npm run test:native-startup

      - name: Native themes, fonts and Always scrollbars
        run: SCRAPE_STARTUP_MODES=current19 SCRAPE_NATIVE_APPEARANCE=1 SCRAPE_SCROLLBAR_MODE=Always npm run test:native-startup

      - name: Narrow native controls and Automatic scrollbars
        run: SCRAPE_STARTUP_MODES=current19 SCRAPE_NATIVE_APPEARANCE=1 SCRAPE_NATIVE_WIDTH=480 SCRAPE_SCROLLBAR_MODE=Automatic npm run test:native-startup

      - name: Native paging and responsive inspector persistence
        run: SCRAPE_STARTUP_MODES=current19 SCRAPE_NATIVE_LAYOUT=1 npm run test:native-startup
