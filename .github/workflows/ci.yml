name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install npm dependencies
        run: npm ci

      - name: Build required sidecar
        run: npm run build:sidecar

      - name: Format check (Rust)
        run: cargo fmt --all --check

      - name: Clippy check (Rust)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (Rust)
        run: cargo test --workspace

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Frontend tests
        run: npm test

      - name: Frontend production build
        run: npm run build

      - name: Production style guard
        run: node scripts/check-style.mjs

      - name: Check bindings drift
        run: |
          cargo test --workspace export_bindings
          git diff --exit-code src/bindings || (echo "TypeScript bindings are out of sync with Rust models. Run 'npm run gen:types' and commit the changes." && exit 1)
