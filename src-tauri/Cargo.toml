[package]
name = "scrape"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Desktop job application scraper and tracking utility."

[lib]
name = "scrape_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
scrape-core = { path = "../crates/scrape-core", features = ["sqlx"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tokio-cron-scheduler = "0.13"
cron = "0.15"
chrono-tz = "0.10"
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "migrate", "macros", "derive"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
tokio.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
tracing.workspace = true
ts-rs.workspace = true
sys-locale = "0.3"
iana-time-zone = "0.1"
serde_path_to_error = "0.1"
url = "2"
regex.workspace = true
scraper = "0.27"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
sha1 = "0.10"
base64 = "0.22"
