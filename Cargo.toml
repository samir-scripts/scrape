[workspace]
resolver = "2"
members = ["src-tauri", "crates/scrape-core", "crates/scrape-worker"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
scrape-core = { path = "crates/scrape-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
tracing = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "derive"] }
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
